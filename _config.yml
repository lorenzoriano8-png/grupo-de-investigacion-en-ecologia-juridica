# Configuración del sitio del Grupo de Investigación en Ecología Jurídica
#
# baseurl es el nombre del repositorio precedido de "/".
# Si algún día se le pone un dominio propio, baseurl se deja vacío: "".
baseurl: "/grupo-de-investigacion-en-ecologia-juridica"
url: ""

lang: es
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["lsquo", "rsquo", "laquo", "raquo"]

# Las carpetas conservan sus nombres originales:
#   _notas        -> notas de prensa
#   _discusiones  -> lugar de reflexión
#   _integrantes  -> miembros
collections:
  articulos:
    output: true
    permalink: /articulos/:name/
  notas:
    output: true
    permalink: /prensa/:name/
  discusiones:
    output: true
    permalink: /reflexion/:name/
  integrantes:
    output: false
  convocatorias:
    output: false

defaults:
  - scope: { type: articulos }
    values: { layout: publicacion, seccion: articulos }
  - scope: { type: notas }
    values: { layout: publicacion, seccion: prensa }
  - scope: { type: discusiones }
    values: { layout: discusion, seccion: reflexion }

# Lugar de reflexión (giscus sobre GitHub Discussions).
giscus:
  repo: "lorenzoriano8-png/grupo-de-investigacion-en-ecologia-juridica"
  repo_id: "R_kgDOVvPveQ"
  category: "Lugar de reflexión"
  category_id: "DIC_kwDOVvPvec4DLL-0"

exclude:
  - LEEME.md
  - README.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
