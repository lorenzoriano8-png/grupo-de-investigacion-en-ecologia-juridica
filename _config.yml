# Configuración del sitio del Grupo de Investigación en Ecología Jurídica
#
# baseurl: si el repositorio se llama "ecologia-juridica", el sitio queda en
#   https://USUARIO.github.io/ecologia-juridica  y baseurl debe ser "/ecologia-juridica".
# Si algún día se le pone un dominio propio, baseurl se deja vacío: "".
baseurl: "/grupo-de-investigacion-en-ecologia-juridica"
url: ""

lang: es
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["lsquo", "rsquo", "laquo", "raquo"]

collections:
  articulos:
    output: true
    permalink: /articulos/:name/
  notas:
    output: true
    permalink: /notas/:name/
  discusiones:
    output: true
    permalink: /discusiones/:name/
  integrantes:
    output: false
  lineas:
    output: false

defaults:
  - scope: { type: articulos }
    values: { layout: publicacion, tipo: Artículo, seccion: articulos }
  - scope: { type: notas }
    values: { layout: publicacion, tipo: Nota, seccion: notas }
  - scope: { type: discusiones }
    values: { layout: discusion, seccion: discusiones }

# Discusiones (giscus). Se llena cuando el repositorio ya exista; ver LEEME.md, paso 4.
# Mientras repo_id esté vacío, las páginas de discusión muestran solo el planteamiento.
giscus:
  repo: ""          # p. ej. "usuario/ecologia-juridica"
  repo_id: ""
  category: "Discusiones del grupo"
  category_id: ""

exclude:
  - LEEME.md
  - README.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
