lema: El derecho visto desde el medio en que vive.
contacto: "[correo de contacto]"
presentacion: |
  El grupo parte de una sospecha compartida: que el derecho no se deja entender del todo si se lo mira como un sistema de normas cerrado sobre sí mismo. Sus categorías y sus instituciones existen en un medio del que dependen y que, a su vez, transforman. Ese medio es social y económico, técnico y también natural, y las relaciones que lo atraviesan son el objeto común de nuestro trabajo.

  Este sitio recoge lo que el grupo produce: los artículos de sus integrantes, las notas breves que acompañan las lecturas, las discusiones que dejamos abiertas en el seminario y el proyecto colectivo que las reúne.

  [Borrador de presentación. Reemplácelo desde el panel de edición.]
