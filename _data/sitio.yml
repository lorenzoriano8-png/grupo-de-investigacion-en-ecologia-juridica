nombre: Grupo de Investigación en Ecología Jurídica
institucion: "[Institución]"

perspectiva: |
  Lo que nos une: un reclamo colectivo. Un llamado a la teoría que no se quede en el ya satirizado cielo de los conceptos jurídicos [subvertir una idea canonizada del derecho, según la cual éste y el Estado se leen en una misma gramática: aquello que el Estado no ha declarado existente carece, en consecuencia, de existencia jurídica] sino que disputa su sentido con la materialidad de las experiencias y las prácticas sociales [partimos de que la experiencia y las prácticas sociales son las productoras del conocimiento jurídico] con mayor apertura epistémica, ontológica, afectiva.

  *Con más sensibilidad...*

  *de lo fenomenológico a lo dogmático...*

  [compartimos la aproximación según la cual el derecho se produce en la calle ---en las interacciones permanentes de quienes la habitamos--- y en los espacios comunitarios en los que ciertas prácticas sociales se vuelven valiosas, en estos espacios colectivos se produce un derecho que la dogmática ortodoxa se resiste a narrar y a leer]

  Una ecología [ como una apuesta académica y política, como forma de relacionarnos colectivamente para investigar y producir conocimiento] que funciona en rizoma [como una apuesta metodológica para pensar el derecho] que se expande, se bifurca y se convierte en interminables fractales a partir de la co-teoría que ofrecen los investigadores -- teóricos...

  *...Hacedores...que tejen vínculos "nodos" de ese conocimiento común, para denunciar lo que las categorías han reificado*

  En el tejido de lo común hay una promesa, recuperar la convencionalidad del derecho [la teoría jurídica también lo ha denominado "derecho libre"] bajo la premisa y la apuesta est-ética, la ética y la estética conjugadas en apuestas teóricas más sensibles [nuestro propósito es identificar el derecho desde su dimensión fenomenológica para retar la inercia de la dogmática, las múltiples formas en que se manifiesta el derecho estatal] Esta captura se realiza a través de la investigación-acción participativa, y su resultado es una declaración estética que narra la experiencia viva del derecho.

