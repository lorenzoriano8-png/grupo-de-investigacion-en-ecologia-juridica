trabaja: |
  El grupo recibe a investigadores, estudiantes de posgrado y de pregrado que quieran trabajar en las preguntas que nos ocupan. Cuando hay convocatorias abiertas aparecen abajo; fuera de ellas, puede escribirnos con una breve presentación y una idea de lo que le gustaría hacer.
