# Panel de edición (Pages CMS: https://app.pagescms.org)
media:
  input: assets/archivos
  output: /assets/archivos

settings:
  commit:
    identity: user

content:
  - name: articulos
    label: Artículos
    type: collection
    path: _articulos
    filename: "{primary}.md"
    view: { primary: title, fields: [title, autores, fecha], sort: fecha, order: desc }
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: autores, label: Autoría, type: string }
      - { name: fecha, label: Fecha, type: date, required: true }
      - { name: revista, label: "Revista o lugar de publicación", type: string }
      - { name: enlace, label: "Enlace a la versión completa", type: string }
      - { name: pdf, label: "PDF (opcional)", type: file }
      - { name: resumen, label: Resumen, type: text }
      - { name: body, label: Texto, type: rich-text }

  - name: prensa
    label: Notas de prensa
    type: collection
    path: _notas
    filename: "{primary}.md"
    view: { primary: title, fields: [title, medio, fecha], sort: fecha, order: desc }
    fields:
      - { name: title, label: Titular, type: string, required: true }
      - { name: medio, label: Medio, type: string }
      - { name: fecha, label: Fecha, type: date, required: true }
      - { name: enlace, label: "Enlace a la nota original", type: string }
      - { name: resumen, label: Resumen, type: text }
      - { name: body, label: Texto, type: rich-text }

  - name: reflexion
    label: Lugar de reflexión
    type: collection
    path: _discusiones
    filename: "{primary}.md"
    view: { primary: title, fields: [title, autor, estado, fecha], sort: fecha, order: desc }
    fields:
      - { name: title, label: "Pregunta o tema", type: string, required: true }
      - { name: autor, label: "Propuesta por", type: string }
      - { name: fecha, label: Fecha, type: date, required: true }
      - name: estado
        label: Estado
        type: select
        default: abierta
        options:
          values: [abierta, cerrada]
      - { name: body, label: Planteamiento, type: rich-text }

  - name: miembros
    label: Miembros
    type: collection
    path: _integrantes
    filename: "{primary}.md"
    view: { primary: title, fields: [title, rol, orden], sort: orden, order: asc }
    fields:
      - { name: title, label: Nombre, type: string, required: true }
      - { name: rol, label: "Rol en el grupo", type: string }
      - { name: filiacion, label: Filiación, type: string }
      - { name: foto, label: "Foto (opcional)", type: image }
      - { name: perfil, label: "ORCID u otro perfil (URL)", type: string }
      - { name: correo, label: Correo, type: string }
      - { name: orden, label: "Orden en la lista", type: number }
      - { name: body, label: "Nota biográfica", type: rich-text }

  - name: convocatorias
    label: Convocatorias (trabaja con nosotros)
    type: collection
    path: _convocatorias
    filename: "{primary}.md"
    view: { primary: title, fields: [title, estado, cierre], sort: cierre, order: desc }
    fields:
      - { name: title, label: Cargo o convocatoria, type: string, required: true }
      - name: estado
        label: Estado
        type: select
        default: abierta
        options:
          values: [abierta, cerrada]
      - { name: cierre, label: "Fecha de cierre", type: date }
      - { name: enlace, label: "Enlace a las bases (opcional)", type: string }
      - { name: body, label: Descripción, type: rich-text }

  - name: sitio
    label: Perspectiva, contacto y textos fijos
    type: file
    path: _data/sitio.yml
    format: yaml
    fields:
      - { name: nombre, label: "Nombre del grupo", type: string }
      - { name: institucion, label: Institución, type: string }
      - { name: perspectiva, label: "Perspectiva (párrafos separados por una línea en blanco)", type: text }
      - name: contacto
        label: Contacto
        type: object
        fields:
          - { name: correo, label: Correo, type: string }
          - { name: direccion, label: Dirección, type: string }
          - { name: telefono, label: Teléfono, type: string }
          - { name: texto, label: "Texto de la página de contacto", type: text }
      - { name: trabaja, label: "Texto de «Trabaja con nosotros»", type: text }
