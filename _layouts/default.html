<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | strip_html }} | {% endif %}{{ site.data.sitio.nombre }}</title>
<meta name="description" content="{{ page.resumen | default: 'Grupo de investigación en ecología jurídica' | strip_html | strip_newlines | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/estilo.css' | relative_url }}">
</head>
<body>
{%- assign sec = page.seccion | default: "inicio" -%}
<header>
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.sitio.nombre | downcase }}</a>
  <nav>
    <a href="{{ '/' | relative_url }}" {% if sec == "inicio" %}class="on"{% endif %}>perspectiva</a>
    <a href="{{ '/articulos/' | relative_url }}" {% if sec == "articulos" %}class="on"{% endif %}>artículos</a>
    <a href="{{ '/prensa/' | relative_url }}" {% if sec == "prensa" %}class="on"{% endif %}>notas de prensa</a>
    <a href="{{ '/reflexion/' | relative_url }}" {% if sec == "reflexion" %}class="on"{% endif %}>lugar de reflexión</a>
    <a href="{{ '/miembros/' | relative_url }}" {% if sec == "miembros" %}class="on"{% endif %}>miembros</a>
    <a href="{{ '/contacto/' | relative_url }}" {% if sec == "contacto" %}class="on"{% endif %}>contacto</a>
    <a href="{{ '/trabaja-con-nosotros/' | relative_url }}" {% if sec == "trabaja" %}class="on"{% endif %}>trabaja con nosotros</a>
  </nav>
</header>
<main>
{{ content }}
</main>
</body>
</html>
